name: mesguard

# The default Compose environment contains only MESGuard and its local
# development dependencies.
services:
  postgres:
    image: ${MESGUARD_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: mesguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MESGUARD_POSTGRES_USER:-mesguard}
      POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      POSTGRES_DB: ${MESGUARD_POSTGRES_DB:-mesguard}
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${MESGUARD_POSTGRES_DATA:-mesguard_postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  sqlserver:
    image: ${MESGUARD_SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: mesguard-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MESGUARD_SQLSERVER_SA_PASSWORD:-MESGuard_Dev!2026}
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_SQLSERVER_PORT:-1433}:1433"
    volumes:
      - ${MESGUARD_SQLSERVER_DATA:-mesguard_sqlserver-data}:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-seed:
    image: ${MESGUARD_SQLSERVER_TOOLS_IMAGE:-mcr.microsoft.com/mssql-tools:latest}
    container_name: mesguard-sqlserver-seed
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MESGUARD_SQLSERVER_SA_PASSWORD:-MESGuard_Dev!2026}
      ReaderPassword: ${MESGUARD_SQLSERVER_PASSWORD:-MESGuard_Reader!2026}
    volumes:
      - ./infra/sqlserver/init:/seed:ro
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/mssql-tools/bin/sqlcmd -b -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD"
        -i /seed/001_mes_demo.sql

  redis:
    image: ${MESGUARD_REDIS_IMAGE:-redis:7-alpine}
    container_name: mesguard-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_REDIS_PORT:-6379}:6379"
    volumes:
      - ${MESGUARD_REDIS_DATA:-mesguard_redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-migrate
    restart: "no"
    command: ["./mesguard-migrate", "up"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_SQLSERVER_PASSWORD: ${MESGUARD_SQLSERVER_PASSWORD:-MESGuard_Reader!2026}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro

volumes:
  mesguard_postgres-data:
  mesguard_sqlserver-data:
  mesguard_redis-data:
