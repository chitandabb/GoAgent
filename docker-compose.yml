name: mesguard

# The default Compose environment contains only MESGuard and its local
# development dependencies.
services:
  postgres:
    image: ${MESGUARD_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: mesguard-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${MESGUARD_POSTGRES_USER:-mesguard}
      POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      POSTGRES_DB: ${MESGUARD_POSTGRES_DB:-mesguard}
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${MESGUARD_POSTGRES_DATA:-mesguard_postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  sqlserver:
    image: ${MESGUARD_SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: mesguard-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MESGUARD_SQLSERVER_SA_PASSWORD:-MESGuard_Dev!2026}
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_SQLSERVER_PORT:-1433}:1433"
    volumes:
      - ${MESGUARD_SQLSERVER_DATA:-mesguard_sqlserver-data}:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sqlserver-seed:
    image: ${MESGUARD_SQLSERVER_TOOLS_IMAGE:-mcr.microsoft.com/mssql-tools:latest}
    container_name: mesguard-sqlserver-seed
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MESGUARD_SQLSERVER_SA_PASSWORD:-MESGuard_Dev!2026}
      ReaderPassword: ${MESGUARD_SQLSERVER_PASSWORD:-MESGuard_Reader!2026}
    volumes:
      - ./infra/sqlserver/init:/seed:ro
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/mssql-tools/bin/sqlcmd -b -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD"
        -i /seed/001_mes_demo.sql

  redis:
    image: ${MESGUARD_REDIS_IMAGE:-redis:7-alpine}
    container_name: mesguard-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_REDIS_PORT:-6379}:6379"
    volumes:
      - ${MESGUARD_REDIS_DATA:-mesguard_redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-stack:
    image: ${MESGUARD_REDIS_STACK_IMAGE:-redis/redis-stack-server:7.4.0-v8}
    container_name: mesguard-redis-stack
    profiles: ["semantic-cache-redis-stack"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_REDIS_STACK_PORT:-6380}:6379"
    volumes:
      - ${MESGUARD_REDIS_STACK_DATA:-mesguard_redis-stack-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MESGUARD_MINIO_IMAGE:-minio/minio:latest}
    container_name: mesguard-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MESGUARD_MINIO_ACCESS_KEY:-mesguard}
      MINIO_ROOT_PASSWORD: ${MESGUARD_MINIO_SECRET_KEY:-mesguard_dev_secret}
      TZ: Asia/Shanghai
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MESGUARD_MINIO_PORT:-9000}:9000"
      - "${MESGUARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${MESGUARD_MINIO_DATA:-mesguard_minio-data}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: ${MESGUARD_RABBITMQ_IMAGE:-rabbitmq:4-management}
    container_name: mesguard-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MESGUARD_RABBITMQ_USER:-mesguard}
      RABBITMQ_DEFAULT_PASS: ${MESGUARD_RABBITMQ_PASSWORD:-mesguard_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_RABBITMQ_PORT:-5672}:5672"
      - "${MESGUARD_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ${MESGUARD_RABBITMQ_DATA:-mesguard_rabbitmq-data}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  searxng:
    image: ${MESGUARD_SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: mesguard-searxng
    profiles: ["web-search-self-hosted"]
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://localhost:${MESGUARD_SEARXNG_PORT:-8081}/"
      TZ: Asia/Shanghai
    ports:
      - "${MESGUARD_SEARXNG_PORT:-8081}:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-migrate
    restart: "no"
    command: ["./mesguard-migrate", "up"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_SQLSERVER_PASSWORD: ${MESGUARD_SQLSERVER_PASSWORD:-MESGuard_Reader!2026}
      MESGUARD_STEPFUN_API_KEY: ${MESGUARD_STEPFUN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MESGUARD_GITHUB_MCP_TOKEN: ${MESGUARD_GITHUB_MCP_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      MESGUARD_MINIO_ACCESS_KEY: ${MESGUARD_MINIO_ACCESS_KEY:-mesguard}
      MESGUARD_MINIO_SECRET_KEY: ${MESGUARD_MINIO_SECRET_KEY:-mesguard_dev_secret}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-outbox-relay
    restart: unless-stopped
    command: ["./mesguard-outbox-relay"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_RABBITMQ_URL: "amqp://${MESGUARD_RABBITMQ_USER:-mesguard}:${MESGUARD_RABBITMQ_PASSWORD:-mesguard_dev_password}@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  diagnosis-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-diagnosis-worker
    restart: unless-stopped
    command: ["./mesguard-diagnosis-worker"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_SQLSERVER_PASSWORD: ${MESGUARD_SQLSERVER_PASSWORD:-MESGuard_Reader!2026}
      MESGUARD_RABBITMQ_URL: "amqp://${MESGUARD_RABBITMQ_USER:-mesguard}:${MESGUARD_RABBITMQ_PASSWORD:-mesguard_dev_password}@rabbitmq:5672/"
      MESGUARD_STEPFUN_API_KEY: ${MESGUARD_STEPFUN_API_KEY:-}
      MESGUARD_OPENCODE_GO_API_KEY: ${MESGUARD_OPENCODE_GO_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MESGUARD_GITHUB_MCP_TOKEN: ${MESGUARD_GITHUB_MCP_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      MESGUARD_MINIO_ACCESS_KEY: ${MESGUARD_MINIO_ACCESS_KEY:-mesguard}
      MESGUARD_MINIO_SECRET_KEY: ${MESGUARD_MINIO_SECRET_KEY:-mesguard_dev_secret}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      sqlserver-seed:
        condition: service_completed_successfully
    volumes:
      - ./config:/app/config:ro

  conversation-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-conversation-worker
    restart: unless-stopped
    command: ["./mesguard-conversation-worker"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_SQLSERVER_PASSWORD: ${MESGUARD_SQLSERVER_PASSWORD:-MESGuard_Reader!2026}
      MESGUARD_RABBITMQ_URL: "amqp://${MESGUARD_RABBITMQ_USER:-mesguard}:${MESGUARD_RABBITMQ_PASSWORD:-mesguard_dev_password}@rabbitmq:5672/"
      MESGUARD_STEPFUN_API_KEY: ${MESGUARD_STEPFUN_API_KEY:-}
      MESGUARD_OPENCODE_GO_API_KEY: ${MESGUARD_OPENCODE_GO_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MESGUARD_GITHUB_MCP_TOKEN: ${MESGUARD_GITHUB_MCP_TOKEN:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      MESGUARD_MINIO_ACCESS_KEY: ${MESGUARD_MINIO_ACCESS_KEY:-mesguard}
      MESGUARD_MINIO_SECRET_KEY: ${MESGUARD_MINIO_SECRET_KEY:-mesguard_dev_secret}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      sqlserver-seed:
        condition: service_completed_successfully
    volumes:
      - ./config:/app/config:ro

  knowledge-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-knowledge-worker
    restart: unless-stopped
    command: ["./mesguard-knowledge-worker"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_RABBITMQ_URL: "amqp://${MESGUARD_RABBITMQ_USER:-mesguard}:${MESGUARD_RABBITMQ_PASSWORD:-mesguard_dev_password}@rabbitmq:5672/"
      MESGUARD_MINIO_ACCESS_KEY: ${MESGUARD_MINIO_ACCESS_KEY:-mesguard}
      MESGUARD_MINIO_SECRET_KEY: ${MESGUARD_MINIO_SECRET_KEY:-mesguard_dev_secret}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  memory-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mesguard-memory-worker
    restart: unless-stopped
    command: ["./mesguard-memory-worker"]
    environment:
      TZ: Asia/Shanghai
      MESGUARD_CONFIG_FILE: /app/config/mesguard.docker.toml
      MESGUARD_POSTGRES_PASSWORD: ${MESGUARD_POSTGRES_PASSWORD:-mesguard_dev_password}
      MESGUARD_RABBITMQ_URL: "amqp://${MESGUARD_RABBITMQ_USER:-mesguard}:${MESGUARD_RABBITMQ_PASSWORD:-mesguard_dev_password}@rabbitmq:5672/"
      MESGUARD_STEPFUN_API_KEY: ${MESGUARD_STEPFUN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

volumes:
  mesguard_postgres-data:
  mesguard_sqlserver-data:
  mesguard_redis-data:
  mesguard_redis-stack-data:
  mesguard_rabbitmq-data:
  mesguard_minio-data:
