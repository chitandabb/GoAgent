openapi: 3.1.0
info:
  title: MESGuard API
  version: 0.1.0-p7-admin-recovery
  description: Current implemented backend contract for authentication, ERP external cases, asynchronous diagnosis tasks, resumable TaskEvent streaming, formal report reading, administrator recovery, and report feedback.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:9090
paths:
  /healthz:
    get:
      operationId: health
      summary: 检查 API 与关键 PostgreSQL 事实库
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        "4XX":
          description: 客户端请求错误
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 本地账号登录
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功并设置 Session/CSRF Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: 使用 Session Cookie 恢复当前用户
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户和 Session 到期时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 幂等退出并撤销 Session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/data-sources:
    get:
      operationId: listDataSources
      summary: 返回当前启用的安全数据源元数据
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 数据源列表；不包含 DSN、地址、账号或密码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/external-cases:
    get:
      operationId: listExternalCases
      summary: 实时只读查询公司 ERP 工单
      security:
        - sessionCookie: []
      parameters:
        - name: dataSourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CaseStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/CasePriority"
        - name: caseType
          in: query
          description: ERP 工单类型，精确匹配
          schema:
            type: string
            maxLength: 64
        - name: reportedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: reportedTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [reportedAt, sourceUpdatedAt, externalCaseKey]
            default: reportedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: 统一工单分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCaseListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/external-cases/{externalCaseId}:
    get:
      operationId: getExternalCase
      summary: 根据 MESGuard 稳定身份实时读取 ERP 工单详情
      security:
        - sessionCookie: []
      parameters:
        - name: externalCaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 工单详情和 ERP 附件安全元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/diagnosis-tasks:
    post:
      operationId: createDiagnosisTask
      summary: 创建异步诊断任务
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisTaskCreateRequest"
      responses:
        "202":
          description: 任务已持久化，等待后续 Outbox Relay/Worker
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/diagnosis-tasks/{taskId}:
    get:
      operationId: getDiagnosisTask
      summary: 查询诊断任务安全摘要
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务状态、快照身份和报告可用性
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diagnosis-tasks/{taskId}/events:
    get:
      operationId: listDiagnosisTaskEvents
      summary: 查询或持续订阅结构化任务事件
      description: application/json 返回游标页；text/event-stream 先从 PostgreSQL 补读，再轮询新事件，终态事件后关闭。断开连接不会取消任务。
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSeq
          in: query
          description: 排他游标，只返回 seq 大于该值的事件
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          description: SSE 重连游标；提供时优先于 afterSeq
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: limit
          in: query
          description: 单次 JSON 页或 SSE PostgreSQL 补读批次的最大事件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 按 seq 升序排列的安全任务事件页或可断点续传的 SSE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskEventsResponse"
            text/event-stream:
              schema:
                type: string
              example: |-
                retry: 3000

                id: 19
                event: task_started
                data: {"seq":19,"eventType":"task_started","payload":{"attemptCount":1},"payloadSchemaVersion":1,"createdAt":"2026-08-03T06:00:00Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diagnosis-tasks/{taskId}/report:
    get:
      operationId: getDiagnosisTaskReport
      summary: 查询 Worker 已提交的正式诊断报告
      description: 返回结构化报告和有序证据声明元数据；不返回完整证据内容、原始 Prompt、模型推理或原始 SQL。
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务创建者或管理员读取正式报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务存在，但当前没有可读取的正式报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/diagnosis-tasks/{taskId}/cancel:
    post:
      operationId: cancelDiagnosisTask
      summary: 幂等请求取消诊断任务
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务此前已经请求取消或已经取消，未重复写事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "202":
          description: 已原子写入 cancel_requested 状态和任务事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/diagnosis-tasks/{taskId}/recover:
    post:
      operationId: recoverDiagnosisTask
      summary: 管理员恢复可重试的失败诊断任务
      description: 仅恢复 agent_execution_failed；原子重置任务执行状态、追加 task_requeued、写入恢复审计并重新打开原 Outbox。恢复保留 attemptCount，下一次 Worker Claim 时再加一。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisTaskRecoveryRequest"
      responses:
        "200":
          description: 同一管理员使用相同幂等键和原因重放原恢复结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskRecoveryResponse"
        "202":
          description: 恢复事务已提交，任务等待 Outbox Relay 和 Worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskRecoveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 幂等键冲突、任务状态或错误不可恢复，或任务输入依赖已不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/diagnosis-reports/{reportId}/reviews:
    get:
      operationId: listDiagnosisReportReviews
      summary: 查询报告当前反馈和追加历史
      security:
        - sessionCookie: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 最新反馈和按时间倒序的历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReviewsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: submitDiagnosisReportReview
      summary: 追加报告人工反馈
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReviewRequest"
      responses:
        "201":
          description: 已追加一条人工反馈
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mesguard_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 128
  responses:
    BadRequest:
      description: 请求格式或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 Session 已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin、CSRF 或权限校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 幂等键冲突或外部工单 fingerprint 已变化
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: 业务输入校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: PostgreSQL 或 ERP SQL Server 暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CaseStatus:
      type: string
      enum: [open, processing, closed]
    CasePriority:
      type: string
      enum: [high, medium, low]
    EnvelopeBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        requestId:
          type: string
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  const: ok
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          maxLength: 256
    User:
      type: object
      required: [id, username, displayName, role, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [analyst, admin]
        mustChangePassword:
          type: boolean
    AuthData:
      type: object
      required: [user, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AuthData"
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [loggedOut]
              properties:
                loggedOut:
                  type: boolean
    DataSource:
      type: object
      required: [id, name, type, environment, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          const: sqlserver
        environment:
          type: string
        status:
          type: string
          enum: [active, disabled]
    DataSourceListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/DataSource"
    ExternalAttachment:
      type: object
      required: [externalAttachmentKey, fileName, mediaType, sizeBytes, contentHash, sourceUpdatedAt]
      properties:
        externalAttachmentKey:
          type: string
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentHash:
          type: string
        sourceUpdatedAt:
          type: string
          format: date-time
    ExternalCase:
      type: object
      required:
        - externalCaseId
        - dataSourceId
        - externalCaseKey
        - title
        - description
        - status
        - priority
        - reportedAt
        - sourceUpdatedAt
        - sourceFingerprint
        - attributes
        - attributesSchemaVersion
        - attachments
        - truncated
      properties:
        externalCaseId: {type: string, format: uuid}
        dataSourceId: {type: string, format: uuid}
        externalCaseKey: {type: string}
        caseType: {type: string}
        title: {type: string}
        description: {type: string}
        category: {type: string}
        module: {type: string}
        status: {$ref: "#/components/schemas/CaseStatus"}
        priority: {$ref: "#/components/schemas/CasePriority"}
        occurredAt: {type: [string, "null"], format: date-time}
        reportedAt: {type: string, format: date-time}
        sourceUpdatedAt: {type: string, format: date-time}
        customerCode: {type: string}
        customerName: {type: string}
        productCode: {type: string}
        productName: {type: string}
        productVersion: {type: string}
        workOrderNo: {type: string}
        workpieceNo: {type: string}
        materialCode: {type: string}
        batchNo: {type: string}
        serialNo: {type: string}
        factoryCode: {type: string}
        workshopCode: {type: string}
        productionLineCode: {type: string}
        workstationCode: {type: string}
        equipmentCode: {type: string}
        sourceSystem: {type: string}
        deploymentEnvironment: {type: string}
        businessDatabaseAlias: {type: string}
        attributes:
          type: object
          additionalProperties: true
        attributesSchemaVersion:
          type: integer
          const: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAttachment"
        sourceFingerprint: {type: string}
        truncated: {type: boolean}
    ExternalCaseResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExternalCase"
    ExternalCaseListData:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalCase"
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    ExternalCaseListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExternalCaseListData"
    DiagnosisTaskCreateRequest:
      type: object
      additionalProperties: false
      required: [externalCaseId, expectedSourceFingerprint, requestText]
      properties:
        externalCaseId:
          type: string
          format: uuid
        expectedSourceFingerprint:
          type: string
          maxLength: 128
        evidenceDataSourceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        requestText:
          type: string
          minLength: 1
          maxLength: 20000
        requestScope:
          $ref: "#/components/schemas/DiagnosisTaskRequestScope"
        requestScopeSchemaVersion:
          type: integer
          minimum: 1
          default: 1
        attachments:
          type: array
          description: 当前版本暂不接受非空附件列表
          maxItems: 0
          items:
            type: object
        retryOfTaskId:
          type: [string, "null"]
          format: uuid
    DiagnosisTaskRequestScope:
      type: object
      additionalProperties: true
      description: >-
        创建时冻结的任务调查范围。allowedCapabilities 表示本任务允许使用的业务能力，
        不表示对应外部依赖当前健康；未提供时后端按 requestedSkill 推导，仍未提供则默认 [case]。
      properties:
        requestedSkill:
          type: string
