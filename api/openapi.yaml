    KnowledgeDocumentVersionRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 最大 50 MiB；支持 UTF-8 TXT/Markdown、PDF、DOCX、XLSX、PPTX、PNG 和 JPEG。
    KnowledgeIngestionData:
      type: object
      required: [documentId, documentVersionId, version, taskId, status, stage, replayed, createdAt]
      properties:
        documentId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        taskId: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, running, retry_wait, cancel_requested, succeeded, partial_succeeded, failed, cancelled]
        stage:
