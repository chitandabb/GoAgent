          enum: [uploaded, scanning, parsing, chunking, indexing, publishing, completed]
        replayed: {type: boolean}
        createdAt: {type: string, format: date-time}
    KnowledgeIngestionResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/KnowledgeIngestionData"
    KnowledgeIngestionTaskData:
      type: object
      required: [taskId, documentVersionId, documentId, status, stage, attemptCount, maxAttempts, progressPercent, createdAt, updatedAt]
      properties:
        taskId: {type: string, format: uuid}
        documentVersionId: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, running, retry_wait, cancel_requested, succeeded, partial_succeeded, failed, cancelled]
        stage:
          type: string
          enum: [uploaded, scanning, parsing, chunking, indexing, publishing, completed]
        attemptCount: {type: integer, minimum: 0, maximum: 10}
        maxAttempts: {type: integer, minimum: 1, maximum: 10}
        progressPercent: {type: integer, minimum: 0, maximum: 100}
