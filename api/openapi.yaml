openapi: 3.1.0
info:
  title: MESGuard API
  version: 0.2.0-m2-knowledge-ingestion
  description: Current implemented backend contract for authentication, ERP external cases, asynchronous diagnosis, administrator recovery, report feedback, and administrator knowledge-source ingestion.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:9090
paths:
  /healthz:
    get:
      operationId: health
      summary: 检查 API 与关键 PostgreSQL 事实库
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        "4XX":
          description: 客户端请求错误
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 本地账号登录
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功并设置 Session/CSRF Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: 使用 Session Cookie 恢复当前用户
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户和 Session 到期时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 幂等退出并撤销 Session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/data-sources:
    get:
      operationId: listDataSources
      summary: 返回当前启用的安全数据源元数据
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 数据源列表；不包含 DSN、地址、账号或密码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/external-cases:
    get:
      operationId: listExternalCases
      summary: 实时只读查询公司 ERP 工单
      security:
        - sessionCookie: []
      parameters:
        - name: dataSourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CaseStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/CasePriority"
        - name: caseType
          in: query
          description: ERP 工单类型，精确匹配
          schema:
            type: string
            maxLength: 64
        - name: reportedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: reportedTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [reportedAt, sourceUpdatedAt, externalCaseKey]
            default: reportedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: 统一工单分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCaseListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/external-cases/{externalCaseId}:
    get:
      operationId: getExternalCase
      summary: 根据 MESGuard 稳定身份实时读取 ERP 工单详情
      security:
        - sessionCookie: []
      parameters:
        - name: externalCaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 工单详情和 ERP 附件安全元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: 查询当前用户的独立会话列表
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 按最近消息时间倒序返回当前用户可见会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createConversation
      summary: 创建独立工作台会话
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreateRequest"
      responses:
        "201":
          description: 会话已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: 查询当前用户的会话摘要
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: 会话摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      summary: 按会话序号补读消息
      description: 只返回当前用户会话的持久化消息和结构化工单/任务引用；afterSeq 为排他游标。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: afterSeq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 消息游标页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: appendConversationUserMessage
      summary: 追加用户消息与结构化上下文引用
      description: 当前版本只接受用户消息。此接口不会创建诊断任务；后续会话 Agent 命令会在独立边界中调用任务应用服务。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageRequest"
      responses:
        "201":
          description: 用户消息已和结构化引用原子持久化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/conversations/{conversationId}/turns:
    post:
      operationId: appendConversationTurn
      summary: 追加用户消息并执行一个受控会话 Agent 回合
      description: |
        在 conversation_turns 中原子创建执行记录和用户消息，再由独立 Conversation Agent
        处理当前回合。
        Agent 只能使用后端按消息引用和依赖状态筛选出的会话 Tool；明确诊断请求
        可创建独立的异步诊断任务，但不会在本请求内执行诊断 Worker。助手只持久化
        最终回答和结构化任务引用，不持久化原始 Tool 结果或模型推理过程。
        客户端必须为一次用户发送生成稳定 UUID 幂等键；同 key 同请求在失败后复用原用户
        消息重试，完成后直接回放原消息对，同 key 不同请求返回 409。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageRequest"
      responses:
        "200":
          description: 复用既有 turn；可能是已完成结果回放，也可能是失败后的同消息重试完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurnResponse"
        "201":
          description: 新 turn、用户消息和助手最终回答均已持久化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/diagnosis-tasks:
    post:
      operationId: createDiagnosisTask
      summary: 创建异步诊断任务
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisTaskCreateRequest"
      responses:
        "202":
          description: 任务已持久化，等待后续 Outbox Relay/Worker
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/diagnosis-tasks/{taskId}:
    get:
      operationId: getDiagnosisTask
      summary: 查询诊断任务安全摘要
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务状态、快照身份和报告可用性
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diagnosis-tasks/{taskId}/events:
    get:
      operationId: listDiagnosisTaskEvents
      summary: 查询或持续订阅结构化任务事件
      description: application/json 返回游标页；text/event-stream 先从 PostgreSQL 补读，再轮询新事件，终态事件后关闭。断开连接不会取消任务。
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSeq
          in: query
          description: 排他游标，只返回 seq 大于该值的事件
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: Last-Event-ID
          in: header
          description: SSE 重连游标；提供时优先于 afterSeq
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: limit
          in: query
          description: 单次 JSON 页或 SSE PostgreSQL 补读批次的最大事件数
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 按 seq 升序排列的安全任务事件页或可断点续传的 SSE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskEventsResponse"
            text/event-stream:
              schema:
                type: string
              example: |-
                retry: 3000

                id: 19
                event: task_started
                data: {"seq":19,"eventType":"task_started","payload":{"attemptCount":1},"payloadSchemaVersion":1,"createdAt":"2026-08-03T06:00:00Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diagnosis-tasks/{taskId}/report:
    get:
      operationId: getDiagnosisTaskReport
      summary: 查询 Worker 已提交的正式诊断报告
      description: 返回结构化报告和有序证据声明元数据；不返回完整证据内容、原始 Prompt、模型推理或原始 SQL。
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务创建者或管理员读取正式报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 任务存在，但当前没有可读取的正式报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/diagnosis-tasks/{taskId}/cancel:
    post:
      operationId: cancelDiagnosisTask
      summary: 幂等请求取消诊断任务
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务此前已经请求取消或已经取消，未重复写事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "202":
          description: 已原子写入 cancel_requested 状态和任务事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/diagnosis-tasks/{taskId}/recover:
    post:
      operationId: recoverDiagnosisTask
      summary: 管理员恢复可重试的失败诊断任务
      description: 仅恢复 agent_execution_failed；原子重置任务执行状态、追加 task_requeued、写入恢复审计并重新打开原 Outbox。恢复保留 attemptCount，下一次 Worker Claim 时再加一。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisTaskRecoveryRequest"
      responses:
        "200":
          description: 同一管理员使用相同幂等键和原因重放原恢复结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskRecoveryResponse"
        "202":
          description: 恢复事务已提交，任务等待 Outbox Relay 和 Worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskRecoveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 幂等键冲突、任务状态或错误不可恢复，或任务输入依赖已不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/knowledge-documents:
    post:
      operationId: createKnowledgeDocument
      summary: 管理员创建企业知识文档并上传首个不可变版本
      description: 文件经 API 有界流式暂存并校验格式签名，随后上传私有对象存储；逻辑文档、queued 版本、pending 入库任务、首个事件和 knowledge.ingest Outbox 在一个 PostgreSQL 事务中创建。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentCreateRequest"
      responses:
        "200":
          description: 相同幂等键和完全相同请求重放原任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionResponse"
        "202":
          description: 原文与入库任务已持久化，等待 Relay 和 Worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}
  /api/v1/admin/knowledge-documents/{documentId}/versions:
    post:
      operationId: createKnowledgeDocumentVersion
      summary: 管理员为已有企业知识文档上传不可变新版本
      description: 新版本保持 queued 且不会替换 current；只有后续入库质量门禁通过并发布后才切换当前版本。该入口不能修改文档标题。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: documentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentVersionRequest"
      responses:
        "200":
          description: 相同幂等键和完全相同请求重放原任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionResponse"
        "202":
          description: 新版已持久化，旧 current 继续提供检索
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/DependencyUnavailable"}
  /api/v1/admin/knowledge-ingestion-tasks/{taskId}:
    get:
      operationId: getKnowledgeIngestionTask
      summary: 管理员查询知识文档入库任务
      description: 返回 PostgreSQL 事实源中的 stage、进度、attempt、取消和错误摘要；不返回 checkpoint 原文、对象存储地址或凭据。
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 当前任务事实
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionTaskResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/admin/knowledge-ingestion-tasks/{taskId}/cancel:
    post:
      operationId: cancelKnowledgeIngestionTask
      summary: 管理员协作式取消知识文档入库任务
      description: pending/running/retry_wait 原子转为 cancel_requested 并追加事件；运行中的 Worker 通过心跳观察取消，服务端不强杀解析进程。重复取消返回原状态。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: taskId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 取消命令已存在或任务已经 cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionTaskResponse"
        "202":
          description: cancel_requested 事实与事件已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeIngestionTaskResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/diagnosis-reports/{reportId}/reviews:
    get:
      operationId: listDiagnosisReportReviews
      summary: 查询报告当前反馈和追加历史
      security:
        - sessionCookie: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 最新反馈和按时间倒序的历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReviewsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: submitDiagnosisReportReview
      summary: 追加报告人工反馈
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReviewRequest"
      responses:
        "201":
          description: 已追加一条人工反馈
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mesguard_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求格式或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 Session 已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin、CSRF 或权限校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 幂等键冲突或外部工单 fingerprint 已变化
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: 业务输入校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: PostgreSQL 或 ERP SQL Server 暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CaseStatus:
      type: string
      enum: [open, processing, closed]
    CasePriority:
      type: string
      enum: [high, medium, low]
    EnvelopeBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        requestId:
          type: string
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  const: ok
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          maxLength: 256
    User:
      type: object
      required: [id, username, displayName, role, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [analyst, admin]
        mustChangePassword:
          type: boolean
    AuthData:
      type: object
      required: [user, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AuthData"
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [loggedOut]
              properties:
                loggedOut:
                  type: boolean
    DataSource:
      type: object
      required: [id, name, type, environment, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          const: sqlserver
        environment:
          type: string
        status:
          type: string
          enum: [active, disabled]
    DataSourceListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/DataSource"
    ExternalAttachment:
      type: object
      required: [externalAttachmentKey, fileName, mediaType, sizeBytes, contentHash, sourceUpdatedAt]
      properties:
        externalAttachmentKey:
          type: string
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentHash:
          type: string
        sourceUpdatedAt:
          type: string
          format: date-time
    ExternalCase:
      type: object
      required:
        - externalCaseId
        - dataSourceId
        - externalCaseKey
        - title
        - description
        - status
        - priority
        - reportedAt
        - sourceUpdatedAt
        - sourceFingerprint
        - attributes
        - attributesSchemaVersion
        - attachments
        - truncated
      properties:
        externalCaseId: {type: string, format: uuid}
        dataSourceId: {type: string, format: uuid}
        externalCaseKey: {type: string}
        caseType: {type: string}
        title: {type: string}
        description: {type: string}
        category: {type: string}
        module: {type: string}
        status: {$ref: "#/components/schemas/CaseStatus"}
        priority: {$ref: "#/components/schemas/CasePriority"}
        occurredAt: {type: [string, "null"], format: date-time}
        reportedAt: {type: string, format: date-time}
        sourceUpdatedAt: {type: string, format: date-time}
        customerCode: {type: string}
        customerName: {type: string}
        productCode: {type: string}
        productName: {type: string}
        productVersion: {type: string}
        workOrderNo: {type: string}
        workpieceNo: {type: string}
        materialCode: {type: string}
        batchNo: {type: string}
        serialNo: {type: string}
        factoryCode: {type: string}
        workshopCode: {type: string}
        productionLineCode: {type: string}
        workstationCode: {type: string}
        equipmentCode: {type: string}
        sourceSystem: {type: string}
        deploymentEnvironment: {type: string}
        businessDatabaseAlias: {type: string}
        attributes:
          type: object
          additionalProperties: true
        attributesSchemaVersion:
          type: integer
          const: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAttachment"
        sourceFingerprint: {type: string}
        truncated: {type: boolean}
    ExternalCaseResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExternalCase"
    ExternalCaseListData:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalCase"
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    ExternalCaseListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExternalCaseListData"
    ConversationStatus:
      type: string
      enum: [active, archived]
    ConversationCreateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          default: ""
    Conversation:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        status: {$ref: "#/components/schemas/ConversationStatus"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastMessageAt: {type: [string, "null"], format: date-time}
    ConversationResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Conversation"
    ConversationListData:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    ConversationListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ConversationListData"
    ConversationCaseReference:
      type: object
      required: [externalCaseId, kind]
      properties:
        externalCaseId: {type: string, format: uuid}
        kind:
          type: string
          enum: [selected, mentioned]
    ConversationTaskReference:
      type: object
      required: [taskId, kind]
      properties:
        taskId: {type: string, format: uuid}
        kind:
          type: string
          enum: [created, referenced]
    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: {type: string, minLength: 1, maxLength: 20000}
        caseReferences:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConversationCaseReference"
        taskReferences:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConversationTaskReference"
    ConversationMessage:
      type: object
      required: [id, conversationId, seq, role, content, contentSchemaVersion, caseReferences, taskReferences, createdAt]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        seq: {type: integer, format: int64, minimum: 1}
        role:
          type: string
          enum: [user, assistant, tool, system]
        content: {type: string}
        contentSchemaVersion: {type: integer, minimum: 1}
        caseReferences:
          type: array
          items:
            $ref: "#/components/schemas/ConversationCaseReference"
        taskReferences:
          type: array
          items:
            $ref: "#/components/schemas/ConversationTaskReference"
        createdAt: {type: string, format: date-time}
    ConversationMessageResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ConversationMessage"
    ConversationTurn:
      type: object
      required: [userMessage, assistantMessage, replayed]
      properties:
        userMessage:
          $ref: "#/components/schemas/ConversationMessage"
        assistantMessage:
          $ref: "#/components/schemas/ConversationMessage"
        replayed:
          type: boolean
          description: true 表示直接返回此前已完成的助手消息，未再次调用模型
    ConversationTurnResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ConversationTurn"
    ConversationMessagesData:
      type: object
      required: [items, afterSeq, nextAfterSeq, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        afterSeq: {type: integer, format: int64, minimum: 0}
        nextAfterSeq: {type: integer, format: int64, minimum: 0}
        hasMore: {type: boolean}
    ConversationMessagesResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ConversationMessagesData"
    DiagnosisTaskCreateRequest:
      type: object
      additionalProperties: false
      required: [externalCaseId, expectedSourceFingerprint, requestText]
      properties:
        externalCaseId:
          type: string
          format: uuid
        expectedSourceFingerprint:
          type: string
          maxLength: 128
        evidenceDataSourceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        requestText:
          type: string
          minLength: 1
          maxLength: 20000
        requestScope:
          $ref: "#/components/schemas/DiagnosisTaskRequestScope"
        requestScopeSchemaVersion:
          type: integer
          minimum: 1
          default: 1
        attachments:
          type: array
          description: 当前版本暂不接受非空附件列表
          maxItems: 0
          items:
            type: object
        retryOfTaskId:
          type: [string, "null"]
          format: uuid
    DiagnosisTaskRequestScope:
      type: object
      additionalProperties: true
      description: >-
        创建时冻结的任务调查范围。allowedCapabilities 表示本任务允许使用的业务能力，
        不表示对应外部依赖当前健康；未提供时后端按 requestedSkill 推导，仍未提供则默认 [case]。
      properties:
        requestedSkill:
          type: string
          enum: [ticket-diagnosis, code-investigation, sql-investigation]
          default: ticket-diagnosis
        allowedCapabilities:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          default: [case]
          items:
            type: string
            enum: [case, code, sql]
    DiagnosisTaskCreateData:
      type: object
      required: [taskId, status, replayed, createdAt]
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          const: pending
        replayed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    DiagnosisTaskCreateResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisTaskCreateData"
    DiagnosisTask:
      type: object
      required: [taskId, externalCaseId, caseSnapshotId, requestText, requestScope, requestScopeSchemaVersion, status, attemptCount, createdAt, updatedAt, reportAvailable]
      properties:
        taskId: {type: string, format: uuid}
        externalCaseId: {type: string, format: uuid}
        caseSnapshotId: {type: string, format: uuid}
        retryOfTaskId: {type: string, format: uuid}
        requestText: {type: string}
        requestScope:
          $ref: "#/components/schemas/DiagnosisTaskRequestScope"
        requestScopeSchemaVersion: {type: integer, minimum: 1}
        status:
          type: string
          enum: [pending, running, cancel_requested, succeeded, failed, cancelled]
        attemptCount: {type: integer, minimum: 0}
        lastErrorCode: {type: string}
        lastErrorMessage: {type: string}
        startedAt: {type: [string, "null"], format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        reportAvailable: {type: boolean}
        reportId: {type: string, format: uuid}
    DiagnosisTaskResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisTask"
    DiagnosisTaskRecoveryRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    DiagnosisTaskRecovery:
      type: object
      additionalProperties: false
      required: [recoveryId, taskId, status, replayed, taskEventSeq, previousAttemptCount, recoveredAt]
      properties:
        recoveryId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        status:
          type: string
          const: pending
        replayed: {type: boolean}
        taskEventSeq: {type: integer, format: int64, minimum: 1}
        previousAttemptCount: {type: integer, minimum: 1}
        recoveredAt: {type: string, format: date-time}
    DiagnosisTaskRecoveryResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisTaskRecovery"
    DiagnosisTaskEvent:
      type: object
      additionalProperties: false
      required: [seq, eventType, payload, payloadSchemaVersion, createdAt]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        eventType:
          type: string
        payload:
          type: object
          additionalProperties: true
        payloadSchemaVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    DiagnosisTaskEventsData:
      type: object
      additionalProperties: false
      required: [items, afterSeq, nextAfterSeq, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisTaskEvent"
        afterSeq:
          type: integer
          format: int64
          minimum: 0
        nextAfterSeq:
          type: integer
          format: int64
          minimum: 0
        hasMore:
          type: boolean
    DiagnosisTaskEventsResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisTaskEventsData"
    DiagnosisReportUsage:
      type: object
      additionalProperties: false
      required: [modelCalls, promptTokens, completionTokens, totalTokens, cachedTokens, reasoningTokens]
      properties:
        modelCalls: {type: integer, minimum: 0}
        promptTokens: {type: integer, minimum: 0}
        completionTokens: {type: integer, minimum: 0}
        totalTokens: {type: integer, minimum: 0}
        cachedTokens: {type: integer, minimum: 0}
        reasoningTokens: {type: integer, minimum: 0}
    DiagnosisReportEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, claimKey, claim, supportType, sourceType, sourceRef, sourceTool, contentHash, collectedAt, redactionStatus, truncated, validityStatus]
      properties:
        evidenceId: {type: string, format: uuid}
        claimKey: {type: string}
        claim: {type: string}
        supportType:
          type: string
          enum: [supports, contradicts, context]
        sourceType:
          type: string
          enum: [case_snapshot, schema_catalog, sql_object_definition, sql_query, code_search, attachment, knowledge_chunk, web]
        sourceRef: {type: string}
        sourceTool: {type: string}
        location: {type: string}
        contentHash: {type: string}
        collectedAt: {type: string, format: date-time}
        redactionStatus:
          type: string
          enum: [not_required, redacted]
        truncated: {type: boolean}
        validityStatus:
          type: string
          enum: [valid, superseded, invalid]
    DiagnosisReport:
      type: object
      additionalProperties: false
      required: [reportId, taskId, conclusionStatus, riskLevel, conclusion, businessSummary, technicalSummary, confidence, limitations, partial, missingEvidence, usage, agentRuns, selectedSkill, executedSkills, agenticRetrievalAttempted, agenticRetrievalAddedEvidence, agenticRetrievalStopReason, reportSchemaVersion, modelProvider, modelId, promptVersion, evidence, generatedAt, createdAt, updatedAt]
      properties:
        reportId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        conclusionStatus:
          type: string
          enum: [conclusive, probable, inconclusive]
        riskLevel:
          type: string
          enum: [low, medium, high]
        conclusion: {type: string}
        businessSummary: {type: string}
        technicalSummary: {type: string}
        confidence:
          type: string
          enum: [high, medium, low]
        limitations:
          type: array
          items: {type: string}
        partial: {type: boolean}
        missingEvidence:
          type: array
          items: {type: string}
        usage:
          $ref: "#/components/schemas/DiagnosisReportUsage"
        agentRuns: {type: integer, minimum: 0}
        selectedSkill: {type: string}
        executedSkills:
          type: array
          items: {type: string}
        stopReason: {type: string}
        agenticRetrievalAttempted: {type: boolean}
        agenticRetrievalAddedEvidence: {type: boolean}
        agenticRetrievalStopReason:
          type: string
          enum: [not_needed, not_eligible, not_selected, new_evidence_added, no_new_evidence, tool_failed, agent_run_failed, run_limit_or_budget, not_attempted]
        reportSchemaVersion: {type: integer, const: 1}
        modelProvider: {type: string}
        modelId: {type: string}
        promptVersion: {type: string}
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisReportEvidence"
        generatedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DiagnosisReportResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisReport"
    ReportReviewVerdict:
      type: string
      enum: [adopted, partially_adopted, rejected]
    ReportReviewRequest:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
