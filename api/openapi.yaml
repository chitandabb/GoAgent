openapi: 3.1.0
info:
  title: MESGuard API
  version: 0.1.0-p7-task-foundation
  description: Current implemented backend contract for authentication, ERP external cases, diagnosis task creation/query, and report feedback.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:9090
paths:
  /healthz:
    get:
      operationId: health
      summary: 检查 API 与关键 PostgreSQL 事实库
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        "4XX":
          description: 客户端请求错误
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 本地账号登录
      security: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功并设置 Session/CSRF Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: 使用 Session Cookie 恢复当前用户
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前用户和 Session 到期时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 幂等退出并撤销 Session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/data-sources:
    get:
      operationId: listDataSources
      summary: 返回当前启用的安全数据源元数据
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 数据源列表；不包含 DSN、地址、账号或密码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/external-cases:
    get:
      operationId: listExternalCases
      summary: 实时只读查询公司 ERP 工单
      security:
        - sessionCookie: []
      parameters:
        - name: dataSourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CaseStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/CasePriority"
        - name: caseType
          in: query
          description: ERP 工单类型，精确匹配
          schema:
            type: string
            maxLength: 64
        - name: reportedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: reportedTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [reportedAt, sourceUpdatedAt, externalCaseKey]
            default: reportedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: 统一工单分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCaseListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/external-cases/{externalCaseId}:
    get:
      operationId: getExternalCase
      summary: 根据 MESGuard 稳定身份实时读取 ERP 工单详情
      security:
        - sessionCookie: []
      parameters:
        - name: externalCaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 工单详情和 ERP 附件安全元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/diagnosis-tasks:
    post:
      operationId: createDiagnosisTask
      summary: 创建异步诊断任务
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosisTaskCreateRequest"
      responses:
        "202":
          description: 任务已持久化，等待后续 Outbox Relay/Worker
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/diagnosis-tasks/{taskId}:
    get:
      operationId: getDiagnosisTask
      summary: 查询诊断任务安全摘要
      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 任务状态、快照身份和报告可用性
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diagnosis-reports/{reportId}/reviews:
    get:
      operationId: listDiagnosisReportReviews
      summary: 查询报告当前反馈和追加历史
      security:
        - sessionCookie: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 最新反馈和按时间倒序的历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReviewsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: submitDiagnosisReportReview
      summary: 追加报告人工反馈
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReviewRequest"
      responses:
        "201":
          description: 已追加一条人工反馈
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mesguard_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 128
  responses:
    BadRequest:
      description: 请求格式或参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未登录或 Session 已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Origin、CSRF 或权限校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 幂等键冲突或外部工单 fingerprint 已变化
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: 业务输入校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyUnavailable:
      description: PostgreSQL 或 ERP SQL Server 暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CaseStatus:
      type: string
      enum: [open, processing, closed]
    CasePriority:
      type: string
      enum: [high, medium, low]
    EnvelopeBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        requestId:
          type: string
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  const: ok
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          maxLength: 256
    User:
      type: object
      required: [id, username, displayName, role, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [analyst, admin]
        mustChangePassword:
          type: boolean
    AuthData:
      type: object
      required: [user, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AuthData"
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [loggedOut]
              properties:
                loggedOut:
                  type: boolean
    DataSource:
      type: object
      required: [id, name, type, environment, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          const: sqlserver
        environment:
          type: string
        status:
          type: string
          enum: [active, disabled]
    DataSourceListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/DataSource"
    ExternalAttachment:
      type: object
      required: [externalAttachmentKey, fileName, mediaType, sizeBytes, contentHash, sourceUpdatedAt]
      properties:
        externalAttachmentKey:
          type: string
        fileName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentHash:
          type: string
        sourceUpdatedAt:
          type: string
          format: date-time
    ExternalCase:
      type: object
      required:
        - externalCaseId
        - dataSourceId
        - externalCaseKey
        - title
        - description
        - status
        - priority
        - reportedAt
        - sourceUpdatedAt
        - sourceFingerprint
        - attributes
        - attributesSchemaVersion
        - attachments
        - truncated
      properties:
        externalCaseId: {type: string, format: uuid}
        dataSourceId: {type: string, format: uuid}
        externalCaseKey: {type: string}
        caseType: {type: string}
        title: {type: string}
        description: {type: string}
        category: {type: string}
        module: {type: string}
        status: {$ref: "#/components/schemas/CaseStatus"}
        priority: {$ref: "#/components/schemas/CasePriority"}
        occurredAt: {type: [string, "null"], format: date-time}
        reportedAt: {type: string, format: date-time}
        sourceUpdatedAt: {type: string, format: date-time}
        customerCode: {type: string}
        customerName: {type: string}
        productCode: {type: string}
        productName: {type: string}
        productVersion: {type: string}
        workOrderNo: {type: string}
        workpieceNo: {type: string}
        materialCode: {type: string}
        batchNo: {type: string}
        serialNo: {type: string}
        factoryCode: {type: string}
        workshopCode: {type: string}
        productionLineCode: {type: string}
        workstationCode: {type: string}
        equipmentCode: {type: string}
        sourceSystem: {type: string}
        deploymentEnvironment: {type: string}
        businessDatabaseAlias: {type: string}
        attributes:
          type: object
          additionalProperties: true
        attributesSchemaVersion:
          type: integer
          const: 1
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAttachment"
        sourceFingerprint: {type: string}
        truncated: {type: boolean}
    ExternalCaseResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExternalCase"
    ExternalCaseListData:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExternalCase"
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    ExternalCaseListResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ExternalCaseListData"
    DiagnosisTaskCreateRequest:
      type: object
      additionalProperties: false
      required: [externalCaseId, expectedSourceFingerprint, requestText]
      properties:
        externalCaseId:
          type: string
          format: uuid
        expectedSourceFingerprint:
          type: string
          maxLength: 128
        evidenceDataSourceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        requestText:
          type: string
          minLength: 1
          maxLength: 20000
        requestScope:
          type: object
          additionalProperties: true
        requestScopeSchemaVersion:
          type: integer
          minimum: 1
          default: 1
        attachments:
          type: array
          description: 当前版本暂不接受非空附件列表
          maxItems: 0
          items:
            type: object
        retryOfTaskId:
          type: [string, "null"]
          format: uuid
    DiagnosisTaskCreateData:
      type: object
      required: [taskId, status, replayed, createdAt]
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          const: pending
        replayed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    DiagnosisTaskCreateResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisTaskCreateData"
    DiagnosisTask:
      type: object
      required: [taskId, externalCaseId, caseSnapshotId, requestText, requestScope, requestScopeSchemaVersion, status, attemptCount, createdAt, updatedAt, reportAvailable]
      properties:
        taskId: {type: string, format: uuid}
        externalCaseId: {type: string, format: uuid}
        caseSnapshotId: {type: string, format: uuid}
        retryOfTaskId: {type: string, format: uuid}
        requestText: {type: string}
        requestScope:
          type: object
          additionalProperties: true
        requestScopeSchemaVersion: {type: integer, minimum: 1}
        status:
          type: string
          enum: [pending, running, cancel_requested, succeeded, failed, cancelled]
        attemptCount: {type: integer, minimum: 0}
        lastErrorCode: {type: string}
        lastErrorMessage: {type: string}
        startedAt: {type: [string, "null"], format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        reportAvailable: {type: boolean}
        reportId: {type: string, format: uuid}
    DiagnosisTaskResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/DiagnosisTask"
    ReportReviewVerdict:
      type: string
      enum: [adopted, partially_adopted, rejected]
    ReportReviewRequest:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
          $ref: "#/components/schemas/ReportReviewVerdict"
        comment:
          type: string
          maxLength: 2000
    ReportReview:
      type: object
      required: [id, reportId, reviewedBy, verdict, comment, createdAt]
      properties:
        id: {type: string, format: uuid}
        reportId: {type: string, format: uuid}
        reviewedBy: {type: string, format: uuid}
        verdict:
          $ref: "#/components/schemas/ReportReviewVerdict"
        comment: {type: string}
        createdAt: {type: string, format: date-time}
    ReportReviewsData:
      type: object
      required: [reportId, current, items]
      properties:
        reportId: {type: string, format: uuid}
        current:
          anyOf:
            - $ref: "#/components/schemas/ReportReview"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportReview"
    ReportReviewResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ReportReview"
    ReportReviewsResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ReportReviewsData"
