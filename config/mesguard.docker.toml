[http]
host = "0.0.0.0"
port = 9090

[auth]
allowedOrigins = ["http://localhost:9090", "http://127.0.0.1:9090"]
cookieDomain = ""
cookieSecure = false
sessionIdleMinutes = 120
sessionAbsoluteMinutes = 720

[log]
level = "info"
format = "json"
environment = "production"
enableFile = false
outputDir = "logs"
maxSizeMB = 100
maxAgeDays = 30
maxBackups = 10
compress = true

[postgres]
host = "postgres"
port = 5432
user = "mesguard"
database = "mesguard"
passwordEnv = "MESGUARD_POSTGRES_PASSWORD"
sslMode = "disable"
maxIdleConns = 10
maxOpenConns = 100

[redis]
host = "redis"
port = 6379
password = ""
database = 0
