[http]
host = "0.0.0.0"
port = 9090

[auth]
allowedOrigins = ["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:9090", "http://127.0.0.1:9090"]
cookieDomain = ""
cookieSecure = false
sessionIdleMinutes = 120
sessionAbsoluteMinutes = 720

[agent]
skillsDirectory = "config/skills"
promptVersion = "diagnosis-v2"
systemPromptFile = "config/prompts/diagnosis-system.md"
baselinePromptFile = "config/prompts/evaluation-baseline.md"
reportContractFile = "config/prompts/report-contract.md"
maxAgentRuns = 2
maxToolCalls = 8
maxEvidenceItems = 16
maxTotalTokens = 16000
timeoutMillis = 90000

[models.chat]
enabled = true
activeProfile = "stepfun-main"

[models.chat.profiles.stepfun-main]
provider = "stepfun"
baseURL = "https://api.stepfun.com/step_plan/v1"
apiKeyEnv = "MESGUARD_STEPFUN_API_KEY"
model = "step-3.7-flash"
reasoningEffort = "medium"
timeoutMillis = 120000
maxOutputTokens = 4096

[models.chat.profiles.qwen-rewrite]
provider = "dashscope"
baseURL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
apiKeyEnv = "DASHSCOPE_API_KEY"
model = "qwen3.6-flash"
thinkingMode = "disabled"
temperature = 0.0
timeoutMillis = 3000
maxOutputTokens = 256

[models.judge]
enabled = false
provider = "dashscope"
baseURL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
apiKeyEnv = "DASHSCOPE_API_KEY"
model = "qwen3-max"
promptFile = "config/prompts/rag-judge.md"
promptVersion = "rag-judge-v1"
timeoutMillis = 120000
maxOutputTokens = 2048

[models.embedding]
enabled = true
profileKey = "knowledge-v1"
provider = "dashscope"
endpoint = "https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding"
apiKeyEnv = "DASHSCOPE_API_KEY"
model = "text-embedding-v4"
dimensions = 1024
distanceMetric = "cosine"
queryInputType = "query"
documentInputType = "document"
normalize = true
configVersion = "embedding-v1"
batchSize = 10
maxConcurrent = 2
timeoutMillis = 30000

[models.rerank]
enabled = false
provider = "dashscope"
endpoint = "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"
apiKeyEnv = "DASHSCOPE_API_KEY"
model = "qwen3-rerank"
maxCandidates = 30
timeoutMillis = 30000

[models.ocr]
enabled = true
provider = "dashscope"
baseURL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
apiKeyEnv = "DASHSCOPE_API_KEY"
model = "qwen-vl-ocr-latest"
promptFile = "config/prompts/ocr-extraction.md"
promptVersion = "ocr-extraction-v1"
timeoutMillis = 120000
maxOutputTokens = 2048

[models.vision]
enabled = true
provider = "dashscope"
baseURL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
apiKeyEnv = "DASHSCOPE_API_KEY"
model = "qwen3-vl-plus"
promptFile = "config/prompts/visual-description.md"
promptVersion = "visual-description-v2"
timeoutMillis = 120000
maxOutputTokens = 2048

[log]
level = "debug"
format = "console"
environment = "development"
enableFile = true
outputDir = "logs"
maxSizeMB = 100
maxAgeDays = 30
maxBackups = 10
compress = true

[postgres]
host = "127.0.0.1"
port = 5432
user = "mesguard"
database = "mesguard"
passwordEnv = "MESGUARD_POSTGRES_PASSWORD"
sslMode = "disable"
maxIdleConns = 10
maxOpenConns = 100

[redis]
host = "127.0.0.1"
port = 6379
password = ""
database = 0

[rabbitmq]
enabled = true
urlEnv = "MESGUARD_RABBITMQ_URL"
exchange = "mesguard.tasks"
diagnosisQueue = "mesguard.diagnosis.execute"
diagnosisRoutingKey = "diagnosis.execute"
knowledgeIngestionQueue = "mesguard.knowledge.ingest"
knowledgeIngestionRoutingKey = "knowledge.ingest"
relayBatchSize = 10
relayPollIntervalMillis = 1000
relayLeaseMillis = 300000
publishConfirmTimeoutMillis = 5000
workerLeaseMillis = 120000
workerRenewIntervalMillis = 30000
workerMaxAttempts = 4

[githubMCP]
enabled = true
endpoint = "https://api.githubcopilot.com/mcp/"
tokenEnv = "MESGUARD_GITHUB_MCP_TOKEN"
timeoutMillis = 30000

[webSearch]
enabled = true
searchProvider = "firecrawl"
contentProvider = "firecrawl"
timeoutMillis = 30000
maxResults = 5
maxFetchedPages = 3
maxPageChars = 20000
maxRounds = 2
maxResponseBytes = 2097152
officialDomains = ["go.dev", "pkg.go.dev", "cloudwego.io", "postgresql.org", "redis.io", "min.io", "rabbitmq.com", "docs.docker.com", "learn.microsoft.com", "docs.firecrawl.dev", "ietf.org", "rfc-editor.org", "w3.org", "nist.gov"]
trustedDomains = ["developer.aliyun.com", "developer.volcengine.com"]

[webSearch.redaction]
maxInputRunes = 1024
maxOutputRunes = 384
minOutputRunes = 8
sensitiveTermsEnv = ""

[webSearch.providers.firecrawl]
baseURL = "https://api.firecrawl.dev"
apiKeyEnv = "FIRECRAWL_API_KEY"

[webSearch.providers.searxng]
baseURL = "http://127.0.0.1:8081"

[minio]
enabled = true
endpoint = "127.0.0.1:9000"
accessKeyEnv = "MESGUARD_MINIO_ACCESS_KEY"
secretKeyEnv = "MESGUARD_MINIO_SECRET_KEY"
useTLS = false
region = "us-east-1"
attachmentBucket = "mesguard-attachments"
knowledgeSourceBucket = "mesguard-knowledge-sources"
autoCreateBuckets = true
timeoutMillis = 5000
maxObjectBytes = 52428800

[knowledge]
pipelineVersion = "ingestion-v1"
maxAttempts = 3
maxUploadBytes = 52428800
chunkMaxRunes = 700
chunkOverlapRunes = 80
chunkWriteBatchSize = 100
parserMaxDocumentUnits = 500
parserMaxArchiveEntries = 4096
parserMaxExpandedBytes = 268435456
parserMaxXMLBytes = 33554432
parserMaxExtractedRunes = 2000000
parserMaxSpreadsheetRows = 10000
parserMaxSpreadsheetColumns = 512
parserMaxVisualAssets = 256
parserMaxVisualAssetBytes = 16777216
parserMaxTotalVisualBytes = 67108864
maxVisualEnrichments = 30
minVisualPixels = 4096

[knowledge.retrieval]
contextExpansionEnabled = true
contextWindow = 1
contextMaxRunes = 1800

[knowledge.retrieval.contextCompression]
enabled = true
maxChunks = 6
maxRunes = 3000
minScore = 0.05

[knowledge.retrieval.queryRewrite]
enabled = false
modelProfile = "qwen-rewrite"
promptFile = "config/prompts/query-rewrite.md"
promptVersion = "query-rewrite-v2"
timeoutMillis = 3000
maxSubqueries = 1
maxOutputRunes = 2048

[knowledge.layout]
enabled = false
provider = "onnxruntime"
modelName = "PP-DocLayout-M"
modelVersion = "7dbfcce3154a55776dc71ca026a4a2a8388dad8d"
modelPath = "models/pp-doclayout-m.onnx"
modelSHA256 = "b237c7e4aef235de8f45778ff2dd96dc21480cade40f01435f640b0ff68ee010"
manifestPath = "config/models/pp-doclayout-m.json"
runtimeLibraryPath = "runtime/onnxruntime.dll"
preprocessVersion = "pp-doclayout-pre-v1"
postprocessVersion = "pp-doclayout-post-v1"
inputWidth = 640
inputHeight = 640
intraOpThreads = 2
interOpThreads = 1
inferenceTimeoutMillis = 5000
maxConcurrentPages = 1
renderDPI = 144
rendererProvider = "pdfium-wasm"
rendererVersion = "go-pdfium-v1.19.6"
rendererAcquireMillis = 5000
rendererTimeoutMillis = 30000
minNativeTextRunes = 64
minNativePrintableRatio = 0.85
minRegionConfidence = 0.65
suppressDecorativePictureDuplicates = true
decorativePictureMinIoU = 0.85
decorativePictureMaxAreaRatio = 0.02
decorativePictureMinConfidenceMargin = 0.15
regionPaddingRatio = 0.01
maxRegions = 256
maxRasterPixels = 20000000
maxRasterBytes = 16777216

[sqlserver]
enabled = true
id = "8d5c67dc-4c09-4ee5-9e80-4d822303dc35"
code = "erp-support-demo"
name = "公司 ERP 工单库（演示）"
environment = "demo"
host = "127.0.0.1"
port = 1433
user = "mesguard_case_reader"
database = "SUPPORT_DEMO"
passwordEnv = "MESGUARD_SQLSERVER_PASSWORD"
encrypt = "disable"
trustServerCertificate = true
maxIdleConns = 5
maxOpenConns = 10
queryTimeoutMillis = 3000
maxTextBytes = 65536
maxResultBytes = 524288

[sqlserver.caseMapping]
relation = "dbo.v_MESGuardExternalCases"

[sqlserver.caseMapping.fields]
externalCaseKey = "TicketID"
caseType = "CaseType"
title = "Title"
description = "Description"
category = "Category"
module = "Module"
status = "Status"
priority = "Priority"
occurredAt = "OccurredAt"
reportedAt = "ReportedAt"
sourceUpdatedAt = "SourceUpdatedAt"
customerCode = "CustomerCode"
customerName = "CustomerName"
productCode = "ProductCode"
productName = "ProductName"
productVersion = "ProductVersion"
workOrderNo = "WorkOrderNo"
workpieceNo = "WorkpieceNo"
materialCode = "MaterialCode"
batchNo = "BatchNo"
serialNo = "SerialNo"
factoryCode = "FactoryCode"
workshopCode = "WorkshopCode"
productionLineCode = "ProductionLineCode"
workstationCode = "WorkstationCode"
equipmentCode = "EquipmentCode"
sourceSystem = "SourceSystem"
deploymentEnvironment = "DeploymentEnvironment"
businessDatabaseAlias = "BusinessDatabaseAlias"

[sqlserver.caseMapping.attributes]
reporterDepartment = "ReporterDepartment"
impactScope = "ImpactScope"

[sqlserver.caseMapping.statusValues]
New = "open"
Investigating = "processing"
Resolved = "closed"

[sqlserver.caseMapping.priorityValues]
Urgent = "high"
Normal = "medium"
Low = "low"

[sqlserver.investigation]
allowedSchemas = ["dbo"]
maxQueryBytes = 8192
maxRows = 100
maxResultBytes = 262144
maxConcurrentQueries = 2

[sqlserver.attachmentMapping]
relation = "dbo.v_MESGuardExternalCaseAttachments"

[sqlserver.attachmentMapping.fields]
externalCaseKey = "TicketID"
externalAttachmentKey = "AttachmentID"
fileName = "FileName"
mediaType = "MediaType"
sizeBytes = "SizeBytes"
objectKey = "ObjectKey"
contentHash = "ContentHash"
sourceUpdatedAt = "SourceUpdatedAt"
