[http]
host = "0.0.0.0"
port = 9090

[log]
level = "debug"
format = "console"
environment = "development"
enableFile = true
outputDir = "logs"
maxSizeMB = 100
maxAgeDays = 30
maxBackups = 10
compress = true

[postgres]
host = "127.0.0.1"
port = 5432
user = "mesguard"
database = "mesguard"
passwordEnv = "MESGUARD_POSTGRES_PASSWORD"
sslMode = "disable"
maxIdleConns = 10
maxOpenConns = 100

[redis]
host = "127.0.0.1"
port = 6379
password = ""
database = 0
