schemaVersion = 1
id = "ticket-diagnosis"
version = "1.0.0"
enabled = true
description = "读取 ERP 工单证据并形成可追溯的初步诊断"
promptFile = "system-prompt.md"
allowedTools = ["read_external_case", "request_code_investigation"]

[budget]
maxContextTokens = 32000
reservedOutputTokens = 4000
maxEvidenceTokens = 12000
maxToolResultTokens = 6000
maxToolResultBytes = 24576

[execution]
maxSteps = 8
timeoutMillis = 45000
