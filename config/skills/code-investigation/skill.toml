schemaVersion = 1
id = "code-investigation"
version = "1.0.0"
enabled = true
description = "在固定 GitHub 仓库和版本内检索代码、文件及提交证据"
promptFile = "system-prompt.md"
allowedTools = ["search_code", "get_file_contents", "list_commits", "get_commit"]

[budget]
maxContextTokens = 48000
reservedOutputTokens = 4000
maxEvidenceTokens = 24000
maxToolResultTokens = 8000
maxToolResultBytes = 32768

[execution]
maxSteps = 12
timeoutMillis = 90000
